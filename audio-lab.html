<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLOCKFIRE Audio Lab</title>
    <link rel="icon" href="data:," />
    <style>
      body { margin: 0; padding: 20px; background: #0d0f14; color: #e8e4da; font: 13px Consolas, 'Malgun Gothic', monospace; }
      h1 { margin: 0 0 4px; color: #ffb43c; letter-spacing: 0.2em; }
      #status { color: #8d8a82; margin-bottom: 16px; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
      .card { background: #15181f; border: 1px solid #2a2d35; padding: 10px; }
      .card.fail { border-color: #ff5a4a; }
      .card h3 { margin: 0 0 6px; font-size: 13px; display: flex; justify-content: space-between; }
      .card canvas { width: 100%; height: 90px; display: block; image-rendering: pixelated; background: #000; }
      .card dl { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 2px 8px; margin: 6px 0 0; font-size: 11px; }
      .card dt { color: #8d8a82; }
      .card button { font: inherit; background: #ffb43c; color: #111; border: 0; padding: 2px 10px; cursor: pointer; }
      .warn { color: #ff5a4a; }
      #start { font: inherit; font-size: 16px; padding: 8px 24px; background: #ffb43c; border: 0; cursor: pointer; margin-bottom: 14px; }
    </style>
  </head>
  <body>
    <h1>AUDIO LAB</h1>
    <p id="status">절차적 효과음 엔진 — 렌더링 결과의 파형·스펙트로그램·측정값. 버튼을 눌러 직접 들어보세요.</p>
    <button id="start">렌더링 시작 / 소리 켜기</button>
    <div id="grid"></div>
    <script type="module" src="/src/audio/lab.ts"></script>
  </body>
</html>
